name: engine

# ONE scan per trading session, after the close.
#
# 21:15 UTC is post-close in BOTH EDT (17:15 ET) and EST (16:15 ET), so the schedule
# survives the DST change instead of relying on runner lag to save it. GitHub cron is
# best-effort and has been running ~60 min late, so expect a ~22:15 UTC start; a cold
# run takes ~2h on Polygon's free tier, so data lands ~20:30 ET — ready for a next-
# morning review.
#
# The old 17:07 UTC "midday check" is gone. It could never do what its name implied:
# get_recent_bars only reads COMPLETED sessions, so a midday run produced the same
# frame as the previous evening. Worse, it took ~2h and straddled the close, caching a
# mix of intraday and closing prices that the post-close run then reused. Pinned
# sessions (engine/session.py) make that impossible now, but the run still had no
# reason to exist.
on:
  schedule:
    - cron: "15 21 * * 1-5"   # post-close year-round (17:15 ET EDT / 16:15 ET EST)
  workflow_dispatch: {}       # manual "Run workflow" button

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: write             # allow committing refreshed data back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Persist the engine's on-disk API cache (grouped-daily frames + per-ticker
      # history) across runs. Immutable grouped dates stay cached forever, so
      # steady-state runs fetch only the newly-completed day + new-to-bucket
      # tickers instead of cold-fetching the whole funnel. A run-id-unique key
      # always saves; restore-keys pulls the most recent cache to build on.
      - name: Cache engine API responses
        uses: actions/cache@v4
        with:
          path: engine/.cache
          key: engine-cache-${{ github.run_id }}
          restore-keys: |
            engine-cache-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan + backtest
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          CONTEXT_UNIVERSE_LIMIT: ${{ vars.CONTEXT_UNIVERSE_LIMIT }}
          # Held tickers, so the scan force-includes and always quotes them. A
          # holding that drops out of the screen otherwise freezes at a stale price
          # in the dashboard — and its trailing stop freezes with it. A secret, not
          # a var: this repo is public and the list is the user's positions.
          HELD_TICKERS: ${{ secrets.HELD_TICKERS }}
        run: |
          python -m engine
          python -m engine.backtest

      - name: Commit refreshed data
        run: |
          git config user.name  "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add web/public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: scheduled refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
